[package]
name = "sophon-sdk"
version = "0.6.0"
edition.workspace = true
license.workspace = true
description = "Thin provider-aware Rust embedding facade for Grok Build"
repository = "https://github.com/fran0220/sophon-sdk"
homepage = "https://github.com/fran0220/sophon-sdk"
documentation = "https://github.com/fran0220/sophon-sdk/tree/main/crates/sophon-sdk"
readme = "README.md"
keywords = ["agent", "grok", "sdk"]
categories = ["api-bindings", "development-tools"]
publish = false

[dependencies]
agent-client-protocol = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
dunce = { workspace = true }
gltf = { version = "=1.4.1", default-features = false, features = ["utils"] }
http = { workspace = true }
indexmap = { workspace = true }
ptyctl = { path = "../codegen/ptyctl" }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sophon-browser = { path = "../sophon-browser" }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
toml = { workspace = true }
ts-rs = { workspace = true, features = ["serde-json-impl"] }
url = { workspace = true }
uuid = { workspace = true }
xai-acp-lib = { workspace = true }
xai-grok-config = { workspace = true }
xai-grok-agent = { workspace = true }
xai-grok-config-types = { workspace = true }
xai-grok-sampler = { workspace = true }
xai-grok-shell = { workspace = true }
xai-grok-tools = { workspace = true }
xai-prompt-queue = { workspace = true }
xai-tool-protocol = { workspace = true }
xai-tool-runtime = { workspace = true }
xai-tool-types = { workspace = true }
xai-tty-utils = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
xai-grok-test-support = { workspace = true }
xai-grok-workspace = { workspace = true }

[lints]
workspace = true
