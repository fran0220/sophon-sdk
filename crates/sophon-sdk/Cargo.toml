[package]
name = "sophon-sdk"
version = "0.4.0"
edition.workspace = true
license.workspace = true
description = "Thin provider-aware Rust embedding facade for Grok Build"
repository = "https://github.com/fran0220/sophon-sdk"
homepage = "https://github.com/fran0220/sophon-sdk"
documentation = "https://github.com/fran0220/sophon-sdk/tree/main/crates/sophon-sdk"
readme = "README.md"
keywords = ["agent", "grok", "sdk"]
categories = ["api-bindings", "development-tools"]
publish = false

[dependencies]
agent-client-protocol = { workspace = true }
async-trait = { workspace = true }
http = { workspace = true }
indexmap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
url = { workspace = true }
xai-acp-lib = { workspace = true }
xai-grok-config = { workspace = true }
xai-grok-sampler = { workspace = true }
xai-grok-shell = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
xai-grok-test-support = { workspace = true }

[lints]
workspace = true
